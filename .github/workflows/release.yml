name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check version
        shell: pwsh
        run: |
          $version = (Get-Content unity/com.magma.vrc.udonluau/package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match package version $version" }

      - name: Build, test and package
        shell: pwsh
        run: ./tools/package.ps1

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" (Get-ChildItem dist -File).FullName --title "UdonLuau ${{ github.ref_name }}" --generate-notes
